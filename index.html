<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xanh Pro ERP • Mini</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --accent: #5856D6;
            --success: #34C759;
            --danger: #FF3B30;
            --bg: #F8F9FB;
            --card: #FFFFFF;
            --text: #1D1D1F;
            --sub: #86868B;
            --border: rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Header Style */
        header { 
            padding: 55px 20px 20px; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--primary); }
        .sync-icon { width: 36px; height: 36px; background: #EEF4FF; color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .sync-icon:active { transform: rotate(180deg) scale(0.9); }

        .container { padding: 15px 15px 120px; max-width: 480px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* Search Box */
        .search-box { 
            background: var(--card); 
            border-radius: 18px; 
            padding: 14px 18px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .search-box input { border: none; outline: none; width: 100%; font-size: 16px; font-weight: 500; margin-left: 10px; }

        /* Pill Filters */
        .pills { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px; padding-bottom: 5px; }
        .pills::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 16px; background: #E9E9EB; border-radius: 100px; font-size: 13px; font-weight: 600; color: #555; white-space: nowrap; cursor: pointer; }
        .pill.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }

        /* Elegant Cards */
        .card { 
            background: var(--card); 
            border-radius: 20px; 
            padding: 16px; 
            margin-bottom: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: 0.2s;
        }
        .card:active { transform: scale(0.98); background: #FAFAFA; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .plate-no { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
        .tag { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .tag-blue { background: #E1F0FF; color: #007AFF; }
        .tag-green { background: #E1F8E9; color: #28A745; }
        .tag-red { background: #FFE5E5; color: #DC3545; }
        .sub-info { font-size: 13px; color: var(--sub); font-weight: 500; }

        /* Form Controls */
        .form-section { background: var(--card); border-radius: 20px; padding: 5px 18px; margin-bottom: 15px; border: 1px solid var(--border); }
        .input-row { padding: 15px 0; border-bottom: 1px solid #F2F2F7; display: flex; align-items: center; position: relative; }
        .input-row:last-child { border-bottom: none; }
        .input-row label { width: 90px; font-size: 14px; font-weight: 700; color: #444; }
        .input-row input { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 600; color: var(--primary); text-align: right; }

        /* Asset Grid */
        .asset-list { margin-top: 15px; }
        .asset-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F8F8F8; }
        .asset-name { font-size: 14px; font-weight: 600; color: #333; }
        .asset-check { font-size: 13px; font-weight: 800; }

        /* Camera Box */
        .camera-btn { 
            background: linear-gradient(135deg, #007AFF, #5856D6); 
            border-radius: 20px; 
            padding: 25px; 
            text-align: center; 
            color: white; 
            font-weight: 800; 
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(88,86,214,0.3);
            cursor: pointer;
        }
        .preview-img { width: 100%; border-radius: 15px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* Navigation Bar */
        nav { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(255,255,255,0.9); 
            backdrop-filter: blur(25px); 
            border-radius: 24px; 
            display: flex; 
            padding: 10px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 2000;
        }
        .nav-tab { flex: 1; text-align: center; color: #A1A1AA; transition: 0.3s; padding: 8px 0; }
        .nav-tab.active { color: var(--primary); transform: translateY(-3px); }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; font-style: normal; }
        .nav-tab span { font-size: 10px; font-weight: 800; }

        /* Suggestion Box */
        .suggest { position: absolute; left: 0; right: 0; top: 100%; background: white; z-index: 5000; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid var(--border); max-height: 200px; overflow-y: auto; }
        .suggest-item { padding: 14px 18px; border-bottom: 1px solid #F5F5F7; font-size: 15px; font-weight: 600; }

        /* Overlay Loader */
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #F3F3F3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-submit { background: var(--primary); color: white; border: none; width: 100%; padding: 18px; border-radius: 18px; font-size: 16px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,122,255,0.2); cursor: pointer; }
    </style>
</head>
<body>

    <div id="loader" class="hidden"><div class="spinner"></div><p style="margin-top:15px; font-weight:700;">Đang xử lý...</p></div>

    <header>
        <h1 id="header-title">Xanh Pro ERP</h1>
        <div class="sync-icon" onclick="syncData()">🔄</div>
    </header>

    <div class="container">
        <!-- VIEW: TRA CỨU -->
        <div id="v-search">
            <div class="search-box">🔍<input type="text" id="q-search" placeholder="Số xe hoặc số khung..." oninput="applyFilter()"></div>
            <div class="pills" id="status-pills"></div>
            <div id="list-search"></div>
        </div>

        <!-- VIEW: KIỂM KÊ -->
        <div id="v-assets" class="hidden">
            <div class="search-box" style="position:relative;">📦<input type="text" id="in-assets" placeholder="Nhập biển số để xem vật tư..." oninput="suggest(this, 's-assets', 'plate')"><div id="s-assets" class="suggest hidden"></div></div>
            <div id="res-assets" class="hidden">
                <div class="card" style="border: 2px solid var(--primary); background: #F4F9FF;">
                    <div style="font-size:24px; font-weight:900; color:var(--primary); margin-bottom:10px;" id="asset-plate"></div>
                    <div id="asset-items"></div>
                </div>
            </div>
        </div>

        <!-- VIEW: BÀN GIAO -->
        <div id="v-handover" class="hidden">
            <div class="form-section">
                <div class="input-row" style="position:relative;"><label>Biển số</label><input type="text" id="h-plate" placeholder="Chọn xe..." oninput="suggest(this, 's-h-plate', 'plate')"><div id="s-h-plate" class="suggest hidden"></div></div>
                <div class="input-row"><label>Số ODO</label><input type="number" id="h-odo" placeholder="0"></div>
            </div>
            <div class="form-section">
                <div class="input-row" style="position:relative;"><label>Người giao</label><input type="text" id="h-sender" placeholder="Họ tên..." oninput="suggest(this, 's-h-sender', 'driver')"><div id="s-h-sender" class="suggest hidden"></div></div>
                <div class="input-row" style="position:relative;"><label>Người nhận</label><input type="text" id="h-receiver" placeholder="Họ tên..." oninput="suggest(this, 's-h-receiver', 'driver')"><div id="s-h-receiver" class="suggest hidden"></div></div>
            </div>
            <div class="form-section"><div class="input-row"><label>Ghi chú</label><input type="text" id="h-notes" placeholder="Tình trạng xe..."></div></div>
            <div class="camera-btn" onclick="document.getElementById('cam-file').click()">📸 CHỤP ẢNH BIÊN BẢN<img id="cam-prev" class="hidden preview-img"><input type="file" id="cam-file" accept="image/*" capture="environment" class="hidden" onchange="showPrev(this)"></div>
            <button class="btn-submit" onclick="submitForm()">XÁC NHẬN GỬI DỮ LIỆU</button>
        </div>

        <!-- VIEW: LỊCH OFF -->
        <div id="v-off" class="hidden">
            <div class="search-box">📅<input type="date" id="off-date" onchange="applyOff()"></div>
            <div class="pills" id="group-pills"></div>
            <div id="list-off"></div>
        </div>

        <!-- VIEW: LỊCH SỬ -->
        <div id="v-history" class="hidden"><div id="list-history"></div></div>
    </div>

    <nav>
        <div class="nav-tab active" onclick="switchV('search')"><i>🔍</i><span>TRA CỨU</span></div>
        <div class="nav-tab" onclick="switchV('assets')"><i>📦</i><span>KIỂM KÊ</span></div>
        <div class="nav-tab" onclick="switchV('handover')"><i>📝</i><span>GIAO XE</span></div>
        <div class="nav-tab" onclick="switchV('off')"><i>📅</i><span>LỊCH OFF</span></div>
        <div class="nav-tab" onclick="switchV('history')"><i>📜</i><span>LỊCH SỬ</span></div>
    </nav>

    <script>
        const GAS = "https://script.google.com/macros/s/AKfycby8GpK2WUhVCGAjfST9A0tiJUo-NsiP6e_nAdsk_7l5eAIR4bc6TCj1lbOFAEkFQR4b/exec";
        let db = { vehicles: [], drivers: [], assets: [], offSchedule: [], handoverLogs: [] };
        let curS = "Tất cả", curG = "Tất cả tổ";

        function norm(s) { return String(s||'').replace(/[^a-zA-Z0-9]/g, '').toLowerCase(); }
        function clean(s) { return String(s||'').replace(/\(.*?\)/g, '').replace(/\d{10,}/g, '').trim(); }

        async function openDB() { return new Promise(res => { const r = indexedDB.open('XanhERP_Mini', 1); r.onupgradeneeded = () => r.result.createObjectStore('data'); r.onsuccess = () => res(r.result); }); }
        async function save(d) { const i = await openDB(); i.transaction('data','readwrite').objectStore('data').put(d, 'db'); }
        async function load() { const i = await openDB(); return new Promise(res => { const r = i.transaction('data').objectStore('data').get('db'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }

        function switchV(id) {
            document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(`v-${id}`).classList.remove('hidden');
            document.querySelectorAll('.nav-tab').forEach((t, i) => t.classList.toggle('active', ['search','assets','handover','off','history'][i] === id));
            document.getElementById('header-title').innerText = {search:'ERP • Tra cứu', assets:'ERP • Kiểm kê', handover:'ERP • Bàn giao', off:'ERP • Lịch OFF', history:'ERP • Lịch sử'}[id];
        }

        async function syncData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const res = await fetch(`${GAS}?action=sync`, { redirect: 'follow' });
                db = await res.json(); await save(db); render();
            } catch(e) { alert("Lỗi kết nối!"); }
            finally { document.getElementById('loader').classList.add('hidden'); }
        }

        function render() {
            if(!db.vehicles) return;
            const sts = ["Tất cả", ...new Set(db.vehicles.map(v => v['Trạng thái cấp 2'] || 'N/A'))];
            document.getElementById('status-pills').innerHTML = sts.map(s => `<div class="pill ${curS===s?'active':''}" onclick="fSt('${s}')">${s}</div>`).join('');
            const grps = ["Tất cả tổ", ...new Set(db.offSchedule.map(o => o['Bạn ở tổ nào'] || 'N/A'))];
            document.getElementById('group-pills').innerHTML = grps.map(g => `<div class="pill ${curG===g?'active':''}" onclick="fGr('${g}')">${g}</div>`).join('');
            applyFilter(); applyOff();
            document.getElementById('list-history').innerHTML = (db.handoverLogs || []).slice(-15).reverse().map(l => `
                <div class="card">
                    <div class="card-header"><span class="plate-no">${l['Biển số xe']}</span><span class="sub-info">${l['Số KM (ODO)']} KM</span></div>
                    <div class="sub-info">${clean(l['Người giao'])} → ${clean(l['Người nhận'])}</div>
                    ${l['Link ảnh biên bản'] ? `<a href="${l['Link ảnh biên bản']}" target="_blank" style="font-size:11px; color:var(--primary); font-weight:800; margin-top:8px; display:block;">📂 XEM BIÊN BẢN</a>` : ''}
                </div>
            `).join('');
        }

        function fSt(s) { curS = s; render(); }
        function fGr(g) { curG = g; render(); }

        function applyFilter() {
            const q = norm(document.getElementById('q-search').value);
            let list = db.vehicles;
            if(curS !== "Tất cả") list = list.filter(v => (v['Trạng thái cấp 2'] || 'N/A') === curS);
            if(q) list = list.filter(v => norm(v['Biển số']).includes(q) || norm(v['Số khung']).includes(q));
            document.getElementById('list-search').innerHTML = list.map(v => {
                const s = v['Trạng thái cấp 2'] || 'N/A';
                const c = s.includes('vận doanh') ? 'tag-green' : (s.includes('nằm') ? 'tag-red' : 'tag-blue');
                return `<div class="card"><div class="card-header"><span class="plate-no">${v['Biển số']}</span><span class="tag ${c}">${s}</span></div><div class="sub-info">Khung: ${v['Số khung']}</div></div>`;
            }).join('');
        }

        function applyOff() {
            const d = document.getElementById('off-date').value;
            let list = db.offSchedule || [];
            if(d) { const sd = new Date(d).toLocaleDateString('en-CA'); list = list.filter(o => new Date(o['Ngày OFF']).toLocaleDateString('en-CA') === sd); }
            if(curG !== "Tất cả tổ") list = list.filter(o => o['Bạn ở tổ nào'] === curG);
            document.getElementById('list-off').innerHTML = list.map(o => `<div class="card"><div class="plate-no">${clean(o['Họ Và Tên'])}</div><div class="sub-info">${o['Lý Do']} • Tổ: ${o['Bạn ở tổ nào']}</div></div>`).join('');
        }

        function suggest(el, bid, type) {
            const q = norm(el.value); const box = document.getElementById(bid);
            if(!q) { box.classList.add('hidden'); return; }
            let m = (type==='plate') ? db.vehicles.filter(v => norm(v['Biển số']).includes(q)).slice(0,5) : db.drivers.filter(d => norm(clean(d['Họ & tên'])).includes(q) || norm(d['Mã tài xế']).includes(q)).slice(0,5);
            box.innerHTML = m.map(i => {
                const v = type==='plate' ? i['Biển số'] : `${clean(i['Họ & tên'])} ${clean(i['Mã tài xế'])}`;
                return `<div class="suggest-item" onmousedown="sel('${v}', '${bid}', '${type}')">${v}</div>`;
            }).join('');
            box.classList.remove('hidden');
        }

        function sel(v, bid, type) {
            const id = bid.replace('s-', '');
            document.getElementById(id).value = v;
            document.querySelectorAll('.suggest').forEach(b => b.classList.add('hidden'));
            if(type === 'plate' && id === 'in-assets') {
                const d = db.assets.find(a => norm(a['Biển số xe']) === norm(v));
                const its = ["Máy Pos", "Sim", "Thảm cabin", "Thảm sau cốp", "Xe Đẩy Hàng", "Dây Ràng", "Bao tay", "Thẻ định vị"];
                document.getElementById('asset-plate').innerText = v;
                document.getElementById('asset-items').innerHTML = its.map(it => {
                    const has = d && d[it] == "1";
                    return `<div class="asset-item"><span class="asset-name">${it}</span><span class="asset-check" style="color:${has?'var(--success)':'var(--danger)'}">${has?'✓ CÓ':'✕ THIẾU'}</span></div>`;
                }).join('');
                document.getElementById('res-assets').classList.remove('hidden');
            }
        }

        function showPrev(i) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('cam-prev').src = e.target.result; document.getElementById('cam-prev').classList.remove('hidden'); }; r.readAsDataURL(i.files[0]); } }

        async function submitForm() {
            const p = document.getElementById('h-plate').value, o = document.getElementById('h-odo').value, s = document.getElementById('h-sender').value, r = document.getElementById('h-receiver').value, n = document.getElementById('h-notes').value;
            if(!p || !o) return alert("Vui lòng điền Biển số & ODO!");
            document.getElementById('loader').classList.remove('hidden');
            const payload = { licensePlate: p, mileage: o, sender: s||"N/A", receiver: r||"N/A", notes: n, actualDate: new Date().toLocaleDateString('vi-VN'), image: document.getElementById('cam-prev').src.startsWith('data') ? document.getElementById('cam-prev').src : null };
            try {
                const res = await fetch(GAS, { method: 'POST', body: JSON.stringify(payload) });
                const resJ = await res.json();
                if(resJ.success) { alert("Bàn giao thành công! Ảnh đang được lưu..."); syncData(); switchV('history'); }
            } catch(e) { alert("Lỗi gửi dữ liệu!"); }
            finally { document.getElementById('loader').classList.remove('hidden'); }
        }

        window.onclick = (e) => { if(!e.target.closest('.search-box') && !e.target.closest('.input-row')) document.querySelectorAll('.suggest').forEach(b => b.classList.add('hidden')); };
        window.onload = async () => { const c = await load(); if(c) { db = c; render(); } else { syncData(); } };
    </script>
</body>
</html>
